<style>:root{--bg:#081227;--s1:#0f1f3d;--s2:#13284c;--s3:#1b345e;--line:#22406e;--muted:#9fb1cf;--text:#f4f7fc;--g:#f6b830;--gd:#8c6410;--gs:rgba(246,184,48,.14);--o:#ff8b37;--od:#6a330c;--os:rgba(255,139,55,.14);--r:#ff5a5a;--rs:rgba(255,90,90,.15);--pk:#ff4fa3;--ok:#34c759;--okd:#1b6e31;--oks:rgba(52,199,89,.15);--bl:#2f7cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg) linear-gradient(180deg,#0c1a36 0,#081227 420px) no-repeat;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}

.top{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 8px}

.ht .hi svg{width:34px;height:34px}
.ht:active{transform:translateY(2px)}
.hb2{position:absolute;top:6px;right:6px;font-style:normal;font-size:11px;font-weight:900;background:#fff;color:#0b1730;border-radius:9px;padding:2px 7px}
.c-or{background:linear-gradient(160deg,#f08a2c,#b9560f)}.c-bl{background:linear-gradient(160deg,#2f7cf6,#1747a8)}.c-in{background:linear-gradient(160deg,#3b4fd0,#1d2a8a)}
.c-tl{background:linear-gradient(160deg,#16a3b4,#0b6976)}.c-rd{background:linear-gradient(160deg,#e05252,#9e2323)}.c-gr{background:linear-gradient(160deg,#36b05a,#1b7536)}
.c-pu{background:linear-gradient(160deg,#8a5be0,#552ca6)}.c-bl2{background:linear-gradient(160deg,#2a64d6,#173f8f)}.c-gr2{background:linear-gradient(160deg,#2e9e6e,#17694a)}
.c-am{background:linear-gradient(160deg,#f6b830,#c48612);color:#1d1405}.c-ok{background:linear-gradient(160deg,#34c759,#1f8f3c)}
.ov{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.ovt{display:block;font-size:19px;font-weight:900;margin-bottom:10px}
.ovg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ovb{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;min-width:0}
.ovb small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ovb b{display:block;font-size:16px;font-weight:900;line-height:1.2;word-break:break-word}
.ovb>div{min-width:0}
.hi2{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile{background:var(--s1);border:1px solid var(--line)}
.tile .ic{background:var(--gs);color:var(--g)}
.card,.item,.stat{border-width:1px}
.card.cur{border-color:var(--g)}
.lockc{border-color:var(--g);margin-bottom:12px}
.estc{background:#eaf7ee;color:#0b1730;border-radius:16px;padding:12px 14px;margin:6px 0 4px;border:2px solid var(--ok)}
.estc.low{background:#fff4e8;border-color:var(--o)}
.estc small{display:block;font-size:13px;font-weight:800;color:#33465f}
.estc b{font-size:28px;font-weight:900;color:#0b1730}
.estc .small{color:#33465f}.estc .small b{font-size:13px}
.estc .badge.ok{background:var(--ok);color:#fff}.estc .badge.o{background:var(--o);color:#fff}
.estc .o{color:#c25a0c}.estc .muted{color:#5b6c86}
.seg{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);border:1px solid transparent}
.seg button.on{color:var(--g);border-color:var(--g);background:var(--gs)}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.vbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.vbox small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.vbox b{display:block;font-size:17px;font-weight:900;margin:4px 0;word-break:break-word}
.vbox.neg b,.vbox.neg small:last-child{color:var(--r)}.vbox.pos b,.vbox.pos small:last-child{color:var(--ok)}
.leg{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.leg i{width:14px;height:14px;border-radius:3px;display:inline-block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--s1);padding:8px 12px;text-align:left;color:var(--text)}
.opt small{display:block;font-size:12px;color:var(--muted)}.opt b{font-size:15px}
.opt.on{background:var(--g);border-color:var(--g);color:#1d1405}.opt.on small{color:#4a3a10}
.clp{display:flex;gap:14px;align-items:center}
.clp .pi{flex:0 0 90px;width:90px;height:110px;border-radius:12px;background:#fff;overflow:hidden;display:grid;place-items:center}.clp .pi img{width:100%;height:100%;object-fit:contain}
.clp b{font-size:20px;font-weight:900;display:block}
.dtag{display:inline-block;margin-top:8px;background:#c92a2a;color:#fff;font-weight:800;font-size:14px;padding:5px 12px;border-radius:10px}.dtag.o{background:var(--o);color:#1d1405}
.clstock{display:grid;grid-template-columns:1fr 1fr;background:#f8e7b8;color:#1d1405;border-radius:14px;padding:12px;margin-top:10px;text-align:center}
.clstock small{display:block;font-size:13px;font-weight:700}.clstock b{font-size:19px;font-weight:900}
.cs{margin-top:4px}
.csin{display:flex;align-items:center;gap:8px;background:#fff;color:#0b1730;border-radius:14px;padding:0 12px;min-height:50px}
.csin input{flex:1;border:0;outline:0;background:none;font-size:17px;color:#0b1730;min-width:0}
.csin button{font-size:18px;color:#0b1730;padding:6px}
.cslist{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.csit{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;text-align:left;color:var(--text)}
.csit:last-child{border-bottom:0}.csit>span:nth-child(2){flex:1}
.csit.on{background:var(--bl);color:#fff}
.csic{flex:0 0 36px;width:36px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff}
.ctag{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid var(--cc);color:#fff;background:color-mix(in srgb,var(--cc) 30%,transparent)}
.ctag.x2{font-size:14px;padding:7px 14px;background:var(--s2);border-color:var(--line)}
.rrow{width:100%;display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.rrow .in{flex:1;min-width:0}.rrow .in b{display:block;font-size:15px}.rrow .in span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rrow>svg{transform:rotate(180deg);color:var(--muted)}
.item.plan.on{border-color:var(--g)}
.setup .lg{width:190px;display:block;margin:0 auto 10px}
.splash .sw{width:300px}
</style></head>
