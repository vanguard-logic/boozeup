<style>:root{--bg:#090b0b;--s1:#111514;--s2:#171c1a;--s3:#202824;--line:#26302a;--muted:#8f9c93;--text:#f4f7f2;--g:#b7ff2a;--gd:#3d5a0e;--gs:rgba(183,255,42,.13);--o:#ff8b37;--od:#5a2a0a;--os:rgba(255,139,55,.13);--r:#ff4d4d;--rs:rgba(255,77,77,.14);--pk:#ff4fa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100svh;padding-bottom:92px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 8px}
.top img.wm{height:34px}
